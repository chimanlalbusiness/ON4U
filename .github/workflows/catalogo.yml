name: Catálogo Databox

# Daily: Databox feed → catalogo/data → new product photos to R2 → commit →
# deploy to Cloudflare. Databox regenerates its files about hourly.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   DATABOX_FTP_HOST  DATABOX_FTP_USER  DATABOX_FTP_PASS          (required)
#   CLOUDFLARE_API_TOKEN  CLOUDFLARE_ACCOUNT_ID                   (photos + deploy)
# Without the Databox secrets the run is skipped; without the Cloudflare ones
# the data is still refreshed and committed, but photos and deploy are skipped.

on:
  schedule:
    - cron: '17 5 * * *'        # daily ~05:17 UTC (only runs from the default branch)
  workflow_dispatch:             # "Run workflow" button (default branch)

permissions:
  contents: write                # to commit the refreshed data

concurrency:
  group: catalogo-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120         # the very first photo upload can take a while
    env:
      DATABOX_FTP_HOST: ${{ secrets.DATABOX_FTP_HOST }}
      DATABOX_FTP_USER: ${{ secrets.DATABOX_FTP_USER }}
      DATABOX_FTP_PASS: ${{ secrets.DATABOX_FTP_PASS }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check secrets
        id: check
        run: |
          if [ -n "$DATABOX_FTP_HOST" ] && [ -n "$DATABOX_FTP_USER" ] && [ -n "$DATABOX_FTP_PASS" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Databox FTP secrets are not set; skipping the catalogue refresh."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "cf=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Cloudflare secrets are not set; photos and deploy will be skipped."
            echo "cf=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ok == 'true'

      - uses: actions/setup-node@v4
        if: steps.check.outputs.ok == 'true'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            scripts/catalogo/package-lock.json
            cloudflare/package-lock.json

      - name: Download Databox files
        if: steps.check.outputs.ok == 'true'
        run: bash scripts/catalogo/fetch.sh

      - name: Build catalogue data
        if: steps.check.outputs.ok == 'true'
        run: node scripts/catalogo/build.mjs   # fails (and keeps the old data) if the feed looks broken

      - name: Upload new photos to R2
        if: steps.check.outputs.ok == 'true' && steps.check.outputs.cf == 'true'
        continue-on-error: true      # a photo problem must not block the data refresh
        working-directory: scripts/catalogo
        run: |
          npm ci
          node photos.mjs --upload

      - name: Commit and push changes
        id: commit
        if: steps.check.outputs.ok == 'true'
        run: |
          git add catalogo/data catalogo.html
          [ -f scripts/catalogo/r2-fotos.txt ] && git add scripts/catalogo/r2-fotos.txt   # only exists after the first photo upload
          if git diff --cached --quiet; then
            echo "No catalogue changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Catalogue: Databox refresh $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloudflare
        if: steps.commit.outputs.changed == 'true' && steps.check.outputs.cf == 'true' && github.ref_name == 'main'
        working-directory: cloudflare
        run: |
          npm ci
          npx wrangler deploy
